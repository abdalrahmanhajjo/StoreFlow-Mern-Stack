# One-click backend deploy on Render (https://render.com).
# In the Render dashboard: New + → Blueprint → pick this repo. It reads this
# file. Then fill in the env vars marked sync:false (they're secrets).
services:
  - type: web
    name: storeflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # your Atlas connection string
      - key: JWT_ACCESS_SECRET
        sync: false        # any long random string
      - key: CLIENT_APP_URL
        sync: false        # your deployed frontend URL, e.g. https://storeflow.vercel.app
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: StoreFlow
