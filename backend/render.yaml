# One-click backend deploy on Render (https://render.com).
# In the Render dashboard: New + → Blueprint → pick this repo. It reads this
# file. Then fill in the env vars marked sync:false (they're secrets).
services:
  - type: web
    name: storeflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # your Atlas connection string
      - key: JWT_ACCESS_SECRET
        sync: false        # any long random string
      - key: CLIENT_APP_URL
        sync: false        # your deployed frontend URL, e.g. https://storeflow.vercel.app
      # Email is sent via Brevo's HTTPS API (port 443). SMTP ports are blocked
      # on Render's free plan, which is why smtp.gmail.com never worked here.
      # Create a free Brevo account, verify your sender email, make an API key.
      - key: BREVO_API_KEY
        sync: false        # your Brevo API key (Settings → SMTP & API → API Keys)
      - key: BREVO_SENDER_EMAIL
        sync: false        # a verified sender address, e.g. your Gmail
      - key: BREVO_SENDER_NAME
        value: StoreFlow
