# One-click FULL-SITE deploy on Render (https://render.com): this single
# service builds and serves both the API and the frontend from one origin.
# One origin means the refresh cookie is first-party — split deployments on
# *.onrender.com / *.vercel.app subdomains are cross-SITE (public-suffix
# domains), and browsers that block third-party cookies drop the session
# right after login ("session ended").
# In the Render dashboard: New + → Blueprint → pick this repo. It reads this
# file. Then fill in the env vars marked sync:false (they're secrets).
services:
  - type: web
    name: storeflow
    runtime: node
    rootDir: backend
    plan: free
    # Also builds the frontend with VITE_API_BASE_URL=/api (relative — the
    # same-origin API this server exposes). Leaving it unset would silently
    # build the app in demo/mock mode with no backend connection.
    buildCommand: npm install && npm run build && cd ../frontend/web && npm install && VITE_API_BASE_URL=/api npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # your Atlas connection string
      - key: JWT_ACCESS_SECRET
        sync: false        # any long random string
      - key: CLIENT_APP_URL
        sync: false        # this service's own public URL, e.g. https://storeflow.onrender.com
      # Email is sent via the Gmail API over HTTPS (port 443). SMTP ports are
      # blocked on Render's free plan, which is why smtp.gmail.com never worked.
      # See DEPLOY.md for how to create the OAuth credentials + refresh token.
      # IMPORTANT: publish the OAuth consent screen ("In production") or the
      # refresh token expires after 7 days.
      - key: GMAIL_CLIENT_ID
        sync: false        # OAuth client ID
      - key: GMAIL_CLIENT_SECRET
        sync: false        # OAuth client secret
      - key: GMAIL_REFRESH_TOKEN
        sync: false        # long-lived refresh token
      - key: GMAIL_SENDER
        sync: false        # the Gmail address you authorized, e.g. you@gmail.com
      - key: GMAIL_SENDER_NAME
        value: StoreFlow
