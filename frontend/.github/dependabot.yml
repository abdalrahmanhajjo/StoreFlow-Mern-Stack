version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/test tooling into a single PR.
      dev-tooling:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "@axe-core/*"
          - "eslint*"
          - "typescript*"
          - "vite"
          - "vitest"
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
